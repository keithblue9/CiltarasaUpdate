        <!-- Dynamic PWA Manifest selection (MUST run before browser fetches manifest) -->
        <script>
          (function(){
            try {
              var isSeller = (window.location.hash || '').indexOf('/seller') !== -1;
              var manifestHref = isSeller ? '/seller-manifest.json' : '/manifest.json';
              var link = document.createElement('link');
              link.rel = 'manifest';
              link.href = manifestHref;
              document.head.appendChild(link);
              if (isSeller) {
                // Update title BEFORE iOS Safari reads it for "Add to Home Screen"
                document.title = 'Ciltarasa Seller';
                var tc = document.querySelector('meta[name="theme-color"]');
                if (tc) tc.setAttribute('content', '#7C2D12');
                var at = document.querySelector('meta[name="apple-mobile-web-app-title"]');
                if (at) at.setAttribute('content', 'Ciltarasa Seller');
              }
            } catch(e) {}
          })();
        </script>

        <script>
          (function(){
            function nuke(){
              try{
                document.querySelectorAll('#emergent-badge, a[href*="emergent.sh"], [data-emergent-badge]').forEach(function(el){
                  el.parentNode && el.parentNode.removeChild(el);
                });
              }catch(e){}
            }
            if(document.readyState!=='loading') nuke();
            document.addEventListener('DOMContentLoaded', nuke);
            window.addEventListener('load', nuke);
            new MutationObserver(nuke).observe(document.documentElement,{childList:true,subtree:true});
          })();
        </script>
