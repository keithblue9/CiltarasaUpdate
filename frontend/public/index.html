        <!--
          ━━━ CRITICAL: Seller vs Buyer PWA detection ━━━
          Runs FIRST so document.write injects <title>, <meta theme-color>, and
          <link rel="manifest"> directly into HTML parsing stream BEFORE iOS Safari
          locks them in for "Add to Home Screen".

          Triggered by EITHER:
            - hash path:  /#/seller
            - query flag: ?app=seller  (use this for fresh tabs to bypass iOS manifest cache)
        -->
        <script>
          (function(){
            try {
              var hash = window.location.hash || '';
              var qs = window.location.search || '';
              var isSeller = hash.indexOf('/seller') !== -1 || qs.indexOf('app=seller') !== -1;
              var t = Date.now(); // cache buster — force iOS Safari to refetch
              if (isSeller) {
                document.write(
                  '<title>Ciltarasa Seller</title>' +
                  '<meta name="theme-color" content="#7C2D12" />' +
                  '<meta name="apple-mobile-web-app-title" content="Ciltarasa Seller" />' +
                  '<link rel="manifest" href="/seller-manifest.json?v=' + t + '" />'
                );
              } else {
                document.write(
                  '<title>Ciltarasa - Homemade Premium Frozen Food</title>' +
                  '<meta name="theme-color" content="#6B0F1A" />' +
                  '<meta name="apple-mobile-web-app-title" content="Ciltarasa" />' +
                  '<link rel="manifest" href="/manifest.json?v=' + t + '" />'
                );
              }
            } catch(e) {
              // Fallback if document.write fails: at least add buyer manifest
              document.write('<title>Ciltarasa</title><link rel="manifest" href="/manifest.json" />');
            }
          })();
        </script>

        <script>
          (function(){
            function nuke(){
              try{
                document.querySelectorAll('#emergent-badge, a[href*="emergent.sh"], [data-emergent-badge]').forEach(function(el){
                  el.parentNode && el.parentNode.removeChild(el);
                });
              }catch(e){}
            }
            if(document.readyState!=='loading') nuke();
            document.addEventListener('DOMContentLoaded', nuke);
            window.addEventListener('load', nuke);
            new MutationObserver(nuke).observe(document.documentElement,{childList:true,subtree:true});
          })();
        </script>
